<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal - Spooky17</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="shortcut icon" href="calaca.ico" />
</head>

<body>
    <!-- Screen 1: Language Selector -->
    <div id="lang-screen" class="screen active">
        <div id="ascii-title" class="ascii-box"></div>
        <div class="button-container">
            <button class="lang-button" onclick="selectLanguage('es')">
                Español
            </button>
            <button class="lang-button" onclick="selectLanguage('en')">
                English
            </button>
        </div>
    </div>

    <!-- Screen 2: Splash Screen -->
    <div id="splash-screen" class="screen">
        <div class="splash-content">
            <pre id="skull-art"></pre>
            <div id="neofetch-info"></div>
        </div>
        <div id="splash-msg"></div>
    </div>

    <!-- Screen 3: Terminal -->
    <div id="terminal-screen" class="screen terminal-screen">
        <div id="output"></div>

        <!-- Mobile Quick Commands Toolbar -->
        <div id="quick-commands"></div>

        <div class="input-line">
            <span class="prompt">spooky17@datascience:~$</span>
            <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false">
        </div>
    </div>

    <!-- Logic -->
    <script src="js/script.js"></script>
</body>

</html>
